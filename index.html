<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nobita & Shizuka 3D Museum & Cinema 🏛️✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Three.js 3D Engine & PeerJS CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #14161f;
      font-family: 'Poppins', sans-serif;
    }
    #canvas3d {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Full Screen Touch Camera Zone */
    #touchLookZone {
      position: absolute;
      inset: 0;
      z-index: 10;
      touch-action: none;
    }

    /* Lobby Screen */
    #lobbyScreen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #232738 0%, #0d0f17 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    .lobby-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 26px 20px;
      border-radius: 26px;
      backdrop-filter: blur(16px);
      max-width: 340px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }
    .lobby-btn {
      width: 100%;
      background: linear-gradient(135deg, #ffd32a 0%, #ffa801 100%);
      color: #1e272e;
      border: none;
      padding: 13px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      margin-top: 14px;
      cursor: pointer;
    }
    .lobby-btn.girl-btn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      margin-top: 10px;
    }

    /* Top HUD */
    #topHud {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 34, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 7px 18px;
      border-radius: 30px;
      font-size: 12px;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffd32a;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffd32a;
    }

    /* Joystick on Bottom Left */
    #joystickZone {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      z-index: 30;
      touch-action: none;
    }
    .joystick-base {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      backdrop-filter: blur(8px);
    }
    .joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #ffd32a, #ffa801);
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(255, 168, 1, 0.6);
      pointer-events: none;
    }

    /* Right Action Deck */
    .action-dock {
      position: absolute;
      bottom: 25px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 35;
    }
    .dock-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(24, 27, 40, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 19px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .dock-btn.active-mic {
      background: #2ed573;
      border-color: #2ed573;
      box-shadow: 0 0 15px rgba(46, 213, 115, 0.7);
    }

    /* Emotes Wheel */
    #emoteWheel {
      position: absolute;
      bottom: 85px;
      right: 25px;
      background: rgba(20, 23, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 10px 14px;
      display: none;
      gap: 12px;
      z-index: 45;
      backdrop-filter: blur(12px);
    }
    .emote-item {
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .emote-item:active { transform: scale(1.3); }

    /* Interaction Prompt */
    #interactPrompt {
      position: absolute;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      display: none;
    }
    .action-bubble {
      background: #ffeaa7;
      color: #2d3436;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 13.5px;
      box-shadow: 0 8px 25px rgba(255, 234, 167, 0.6);
      cursor: pointer;
    }

    /* Cinema TV Floating HUD */
    #cinemaControls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 20, 30, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 40px;
      padding: 8px 20px;
      display: none;
      align-items: center;
      gap: 15px;
      z-index: 50;
      backdrop-filter: blur(12px);
    }
    .cinema-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .cinema-btn.stand-up {
      background: #ff4757;
      border-color: #ff6b81;
    }

    /* Modal For Viewing Memory Frame */
    #photoModal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      z-index: 80;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    #photoModal img {
      max-width: 85%;
      max-height: 60vh;
      border-radius: 14px;
      border: 4px solid #fff;
    }
    #photoModal p {
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      margin-top: 15px;
      text-align: center;
    }
    .modal-close-btn {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid #fff;
      padding: 8px 25px;
      border-radius: 30px;
      cursor: pointer;
    }

    /* Proposal Finale Card */
    #proposalCard {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 90%;
      max-width: 360px;
      background: #171822;
      border: 2px solid #ffd32a;
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      color: #fff;
      box-shadow: 0 15px 50px rgba(255, 211, 42, 0.35);
      z-index: 95;
      display: none;
    }
    #proposalCard.active { display: block; }
    .prop-btn-yes {
      background: #2ed573;
      color: #fff;
      border: none;
      font-size: 16px;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 30px;
      cursor: pointer;
    }
    .prop-btn-no {
      background: #ff4757;
      color: #fff;
      border: none;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- Touch Look Swipe Area -->
  <div id="touchLookZone"></div>

  <!-- Lobby Screen -->
  <div id="lobbyScreen">
    <div class="lobby-box">
      <div style="font-size: 45px; margin-bottom: 8px;">🏛️👓🎀</div>
      <h2 style="font-family:'Playfair Display',serif; color:#ffeaa7; margin-bottom: 6px;">Nobita & Shizuka Museum</h2>
      <p style="font-size: 12.5px; color: #ccc; margin-bottom: 18px;">Swipe screen to look around 360°. Live mic & synchronized theatre included!</p>
      <button class="lobby-btn" onclick="startAsHost()">1. Nobita (Host Boy) 👓</button>
      <button class="lobby-btn girl-btn" onclick="startAsPartner()">2. Shizuka (Join Girl) 🎀</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="topHud">
    <div class="status-dot"></div>
    <span id="hudMsg">Waiting for Shizuka / Nobita...</span>
  </div>

  <!-- Joystick -->
  <div id="joystickZone">
    <div class="joystick-base">
      <div class="joystick-stick" id="stickHandle"></div>
    </div>
  </div>

  <!-- Action Deck -->
  <div class="action-dock">
    <button class="dock-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <button class="dock-btn" onclick="toggleEmoteWheel()">🕺</button>
  </div>

  <!-- Emote Wheel -->
  <div id="emoteWheel">
    <div class="emote-item" onclick="triggerEmote('dance')">💃</div>
    <div class="emote-item" onclick="triggerEmote('wave')">👋</div>
    <div class="emote-item" onclick="triggerEmote('heart')">💖</div>
    <div class="emote-item" onclick="triggerEmote('bow')">🙇‍♂️</div>
  </div>

  <!-- Interaction Prompt -->
  <div id="interactPrompt">
    <button class="action-bubble" id="actionBtn" onclick="onInteractTrigger()">Action</button>
  </div>

  <!-- Cinema HUD -->
  <div id="cinemaControls">
    <button class="cinema-btn" id="playPauseBtn" onclick="toggleVideoPlayback(true)">⏸️ Pause</button>
    <button class="cinema-btn stand-up" onclick="standUpFromSofa(true)">Utho 🚶‍♂️</button>
  </div>

  <!-- Photo Modal View -->
  <div id="photoModal">
    <img id="modalImg" src="photo1.jpg" alt="Memory">
    <p id="modalCaption">Every moment with you is a masterpiece. ✨</p>
    <button class="modal-close-btn" onclick="closeModal()">Close ✕</button>
  </div>

  <!-- Proposal Card -->
  <div id="proposalCard">
    <div style="font-size: 45px; margin-bottom: 5px;">💍✨</div>
    <h2 style="font-family: 'Playfair Display', serif; color: #ffd1dc; margin-bottom: 10px;">The Most Special Art</h2>
    <p style="font-size: 13.5px; color: #ccc; line-height: 1.5; margin-bottom: 20px;">
      "Nobita aur Shizuka ki tarah... Will you be mine forever? 💖"
    </p>
    <div style="display: flex; justify-content: center; gap: 15px; align-items: center; min-height: 50px; position: relative;">
      <button class="prop-btn-yes" id="yesBtn" onclick="onProposalYes()">YES! 🥰</button>
      <button class="prop-btn-no" id="noBtn">No 🙈</button>
    </div>
  </div>

  <!-- Media Elements -->
  <video id="theatreVideo" playsinline webkit-playsinline loop preload="auto" style="display:none;">
    <source src="couple_video.mp4" type="video/mp4">
  </video>
  <audio id="remoteAudio" autoplay></audio>

  <!-- 3D Canvas -->
  <canvas id="canvas3d"></canvas>
    <script>
    /* P2P Multiplayer Networking via WebRTC (PeerJS) */
    let peer = null;
    let peerConn = null;
    let localStream = null;
    let isMicOn = false;
    let myRole = 'host'; // 'host' = Nobita, 'client' = Shizuka
    const ROOM_ID = "special-one-love-room-998877";

    /* Camera Orbit / Swipe Angles */
    let camPitch = 0.25; // Vertical tilt
    let camYaw = 0;      // Horizontal rotation
    let camDistance = 5.2;

    function startAsHost() {
      myRole = 'host';
      document.getElementById('lobbyScreen').style.display = 'none';
      initPeer(ROOM_ID);
      init3D();
    }

    function startAsPartner() {
      myRole = 'client';
      document.getElementById('lobbyScreen').style.display = 'none';
      initPeer(null);
      init3D();
    }

    function initPeer(customId) {
      peer = customId ? new Peer(customId) : new Peer();

      peer.on('open', (id) => {
        if (myRole === 'client') {
          peerConn = peer.connect(ROOM_ID);
          setupDataConnection();
        }
      });

      peer.on('connection', (conn) => {
        peerConn = conn;
        setupDataConnection();
      });

      peer.on('call', (call) => {
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
          .then((stream) => {
            localStream = stream;
            call.answer(stream);
            call.on('stream', (remoteStream) => {
              document.getElementById('remoteAudio').srcObject = remoteStream;
            });
          })
          .catch(e => console.log("Mic call failed", e));
      });
    }

    function setupDataConnection() {
      peerConn.on('open', () => {
        document.getElementById('hudMsg').innerText = myRole === 'host' ? "Shizuka Joined! 🎀" : "Nobita Connected! 👓";
        document.querySelector('.status-dot').style.background = "#2ed573";
      });

      peerConn.on('data', (data) => {
        if (data.type === 'move') {
          if (remoteAvatar) {
            remoteAvatar.position.set(data.x, data.y, data.z);
            remoteAvatar.rotation.y = data.rotY;
            if (remoteLegLeft && remoteLegRight) {
              remoteLegLeft.rotation.x = data.legL;
              remoteLegRight.rotation.x = data.legR;
            }
          }
        } else if (data.type === 'emote') {
          playRemoteEmote(data.emote);
        } else if (data.type === 'video') {
          if (data.action === 'play') {
            videoElement.currentTime = data.time || 0;
            videoElement.play();
            document.getElementById('playPauseBtn').innerText = "⏸️ Pause";
          } else if (data.action === 'pause') {
            videoElement.pause();
            document.getElementById('playPauseBtn').innerText = "▶️ Play";
          }
        } else if (data.type === 'sit') {
          sitOnSofaTogether(false);
        } else if (data.type === 'stand') {
          standUpFromSofa(false);
        }
      });
    }

    function sendMultiplayerPacket(packet) {
      if (peerConn && peerConn.open) {
        peerConn.send(packet);
      }
    }

    function toggleMic() {
      const btn = document.getElementById('micBtn');
      if (!isMicOn) {
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
          .then((stream) => {
            localStream = stream;
            isMicOn = true;
            btn.classList.add('active-mic');
            btn.innerText = "🎙️";

            if (peerConn && peerConn.peer) {
              const call = peer.call(peerConn.peer, stream);
              call.on('stream', (remStream) => {
                document.getElementById('remoteAudio').srcObject = remStream;
              });
            }
          })
          .catch(err => {
            alert("Voice chat ke liye browser me mic allow karo!");
          });
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        isMicOn = false;
        btn.classList.remove('active-mic');
        btn.innerText = "🎤";
      }
    }

    /* Screen Swipe Camera Rotation (Touch + Mouse Support) */
    function setupCameraLookSwipe() {
      const touchZone = document.getElementById('touchLookZone');
      let isTouching = false;
      let lastX = 0, lastY = 0;

      touchZone.addEventListener('touchstart', (e) => {
        // Exclude touches on bottom-left joystick zone
        const t = e.touches[0];
        if (t.clientX < 150 && t.clientY > window.innerHeight - 150) return;
        isTouching = true;
        lastX = t.clientX;
        lastY = t.clientY;
      }, { passive: false });

      touchZone.addEventListener('touchmove', (e) => {
        if (!isTouching) return;
        const t = e.touches[0];
        const dx = t.clientX - lastX;
        const dy = t.clientY - lastY;
        lastX = t.clientX;
        lastY = t.clientY;

        camYaw -= dx * 0.007; // Rotate left/right
        camPitch += dy * 0.005; // Tilt up/down
        camPitch = Math.max(0.05, Math.min(1.1, camPitch)); // Clamp angles
      }, { passive: false });

      const endTouch = () => { isTouching = false; };
      touchZone.addEventListener('touchend', endTouch);
      touchZone.addEventListener('touchcancel', endTouch);

      // Desktop Mouse Look Support
      let isMouseDown = false;
      window.addEventListener('mousedown', (e) => {
        if (e.clientX < 150 && e.clientY > window.innerHeight - 150) return;
        isMouseDown = true;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        camYaw -= dx * 0.006;
        camPitch += dy * 0.004;
        camPitch = Math.max(0.05, Math.min(1.1, camPitch));
      });
      window.addEventListener('mouseup', () => { isMouseDown = false; });
    }
          /* Three.js Engine Variables */
    let scene, camera, renderer;
    let localAvatar, remoteAvatar;
    let legLeft, legRight, armLeft, armRight;
    let remoteLegLeft, remoteLegRight, remoteArmLeft, remoteArmRight;
    let frames = [];
    let joystickActive = false;
    let joyMove = { x: 0, y: 0 };
    let walkCycle = 0;
    let nearbyItem = null;
    let isSitting = false;
    let currentEmote = null;

    const videoElement = document.getElementById('theatreVideo');
    let videoTexture = null;

    function init3D() {
      const canvas = document.getElementById('canvas3d');
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x191c29);
      scene.fog = new THREE.FogExp2(0x191c29, 0.018);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 120);

      // Bright Gallery Lighting
      const ambient = new THREE.AmbientLight(0xfff7ea, 0.95);
      scene.add(ambient);

      const hemiLight = new THREE.HemisphereLight(0xffeedd, 0x334466, 0.6);
      scene.add(hemiLight);

      buildLuxuryGallery();
      buildCrystalChandelier();
      buildCinemaScreenAndSofa();
      createNobitaAndShizuka();
      setupJoystick();
      setupCameraLookSwipe();
      setupProposalButtons();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    /* Luxury Bright Gallery Hall */
    function buildLuxuryGallery() {
      const textureLoader = new THREE.TextureLoader();

      // Polished Reflective Marble Floor
      const floorGeo = new THREE.PlaneGeometry(28, 75);
      const floorMat = new THREE.MeshStandardMaterial({ 
        color: 0x242838, 
        roughness: 0.15, 
        metalness: 0.35 
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Elegant White Ceiling
      const ceilGeo = new THREE.PlaneGeometry(28, 75);
      const ceilMat = new THREE.MeshStandardMaterial({ color: 0x2d3245, roughness: 0.9 });
      const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.y = 9.2;
      scene.add(ceiling);

      // Warm Modern Gallery Walls
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xe6e3dc, roughness: 0.6 });

      const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.8, 9.2, 75), wallMat);
      wallLeft.position.set(-14, 4.6, 0);
      scene.add(wallLeft);

      const wallRight = new THREE.Mesh(new THREE.BoxGeometry(0.8, 9.2, 75), wallMat);
      wallRight.position.set(14, 4.6, 0);
      scene.add(wallRight);

      const wallBack = new THREE.Mesh(new THREE.BoxGeometry(28, 9.2, 0.8), wallMat);
      wallBack.position.set(0, 4.6, 37.5);
      scene.add(wallBack);

      const wallFront = new THREE.Mesh(new THREE.BoxGeometry(28, 9.2, 0.8), wallMat);
      wallFront.position.set(0, 4.6, -37.5);
      scene.add(wallFront);

      // Photo Frames Configuration
      const frameData = [
        { x: -13.5, z: 22, rotY: Math.PI / 2, src: 'photo1.jpg', label: "Our Beautiful Beginning 🌸" },
        { x: 13.5, z: 22, rotY: -Math.PI / 2, src: 'photo2.jpg', label: "That Pure Sweet Smile ✨" },
        { x: -13.5, z: -18, rotY: Math.PI / 2, src: 'photo3.jpg', label: "Favorite Memories Together 🚗" },
        { x: 13.5, z: -18, rotY: -Math.PI / 2, src: 'photo4.jpg', label: "Unbreakable Connection ♾️" },
        { x: 0, z: -37, rotY: 0, src: 'photo1.jpg', label: "Special Secret Spotlight 💍", isProposal: true }
      ];

      frameData.forEach((data) => {
        // Bright Warm Spotlight on Every Photo
        const spot = new THREE.SpotLight(0xfff1cf, 3.2, 16, Math.PI / 3.8, 0.45);
        spot.position.set(data.x * 0.7, 8.2, data.z);
        spot.target.position.set(data.x, 3.8, data.z);
        scene.add(spot);
        scene.add(spot.target);

        // Golden Frame Border
        const border = new THREE.Mesh(
          new THREE.BoxGeometry(4.4, 5.4, 0.15),
          new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.25, metalness: 0.9 })
        );
        border.position.set(data.x, 3.8, data.z);
        border.rotation.y = data.rotY;
        scene.add(border);

        // Image Canvas
        const photoTex = textureLoader.load(data.src);
        const pic = new THREE.Mesh(
          new THREE.PlaneGeometry(4.0, 5.0),
          new THREE.MeshBasicMaterial({ map: photoTex })
        );
        pic.position.set(data.x + (data.x > 0 ? -0.1 : (data.x < 0 ? 0.1 : 0)), 3.8, data.z + (data.z === -37 ? 0.1 : 0));
        pic.rotation.y = data.rotY;
        scene.add(pic);

        frames.push({ x: data.x, z: data.z, src: data.src, label: data.label, isProposal: data.isProposal });
      });
    }

    /* Grand Crystal Golden Chandelier (Jhummar) */
    function buildCrystalChandelier() {
      const jhummar = new THREE.Group();
      jhummar.position.set(0, 8.8, 4);

      const goldMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.95, roughness: 0.15 });
      const crystalMat = new THREE.MeshStandardMaterial({ 
        color: 0xffffff, 
        metalness: 0.1, 
        roughness: 0.05, 
        transparent: true, 
        opacity: 0.85 
      });

      // Ceiling Mounting Chain & Base
      const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.2, 16), goldMat);
      jhummar.add(baseMesh);

      const rodMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8), goldMat);
      rodMesh.position.y = -0.6;
      jhummar.add(rodMesh);

      // Ring 1 (Top Tier)
      const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.12, 12, 32), goldMat);
      ring1.rotation.x = Math.PI / 2;
      ring1.position.y = -1.2;
      jhummar.add(ring1);

      // Ring 2 (Middle Tier)
      const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.1, 12, 28), goldMat);
      ring2.rotation.x = Math.PI / 2;
      ring2.position.y = -1.9;
      jhummar.add(ring2);

      // Ring 3 (Bottom Tier)
      const ring3 = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.08, 12, 20), goldMat);
      ring3.rotation.x = Math.PI / 2;
      ring3.position.y = -2.5;
      jhummar.add(ring3);

      // Hanging Crystals Droplets
      const addCrystals = (radius, count, yPos, height) => {
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const drop = new THREE.Mesh(new THREE.ConeGeometry(0.12, height, 6), crystalMat);
          drop.position.set(Math.cos(angle) * radius, yPos, Math.sin(angle) * radius);
          drop.rotation.x = Math.PI;
          jhummar.add(drop);
        }
      };

      addCrystals(2.2, 16, -1.6, 0.65);
      addCrystals(1.4, 10, -2.2, 0.55);
      addCrystals(0.7, 6, -2.8, 0.5);

      // Jhummar Core Glowing Chandelier Light
      const jhummarLight = new THREE.PointLight(0xffe6a3, 3.8, 32);
      jhummarLight.position.set(0, -2.0, 0);
      jhummar.add(jhummarLight);

      scene.add(jhummar);
    }

    /* Joystick Setup */
    function setupJoystick() {
      const zone = document.getElementById('joystickZone');
      const handle = document.getElementById('stickHandle');
      const maxRadius = 38;

      function handleTouch(e) {
        if (isSitting) return;
        const touch = e.touches[0];
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const dist = Math.hypot(dx, dy);

        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        handle.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joyMove.x = dx / maxRadius;
        joyMove.y = dy / maxRadius;
        joystickActive = true;
      }

      function stopTouch() {
        handle.style.transform = `translate(-50%, -50%)`;
        joyMove.x = 0;
        joyMove.y = 0;
        joystickActive = false;
      }

      zone.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e); });
      zone.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); });
      zone.addEventListener('touchend', stopTouch);
      zone.addEventListener('touchcancel', stopTouch);
    }

    /* Proximity Interaction */
    function checkInteractions() {
      if (!localAvatar || isSitting) return;
      const prompt = document.getElementById('interactPrompt');
      const btn = document.getElementById('actionBtn');

      let found = null;
      for (let f of frames) {
        const d = Math.hypot(localAvatar.position.x - f.x, localAvatar.position.z - f.z);
        if (d < 4.5) {
          found = f;
          break;
        }
      }

      nearbyItem = found;
      if (found) {
        prompt.style.display = 'block';
        if (found.isSofa) {
          btn.innerText = "Sit & Watch Movie 🍿";
        } else if (found.isProposal) {
          btn.innerText = "Open The Secret 💍";
        } else {
          btn.innerText = "View Memory 🖼️";
        }
      } else {
        prompt.style.display = 'none';
      }
    }

    /* Main Render & Animation Loop with Camera Orbit */
    function animate() {
      requestAnimationFrame(animate);

      if (localAvatar && !isSitting) {
        if (joystickActive) {
          const speed = 0.16;

          // Move relative to current camera yaw angle
          const forward = -joyMove.y;
          const side = joyMove.x;
          
          localAvatar.position.x += (Math.sin(camYaw) * forward + Math.cos(camYaw) * side) * speed;
          localAvatar.position.z += (Math.cos(camYaw) * forward - Math.sin(camYaw) * side) * speed;

          localAvatar.position.x = Math.max(-11.5, Math.min(11.5, localAvatar.position.x));
          localAvatar.position.z = Math.max(-35, Math.min(35, localAvatar.position.z));

          // Rotate character towards moving direction
          const moveAngle = Math.atan2(
            Math.sin(camYaw) * forward + Math.cos(camYaw) * side,
            Math.cos(camYaw) * forward - Math.sin(camYaw) * side
          );
          localAvatar.rotation.y = moveAngle;

          walkCycle += 0.22;
          legLeft.rotation.x = Math.sin(walkCycle) * 0.65;
          legRight.rotation.x = -Math.sin(walkCycle) * 0.65;
          armLeft.rotation.x = -Math.sin(walkCycle) * 0.5;
          armRight.rotation.x = Math.sin(walkCycle) * 0.5;

          sendMultiplayerPacket({
            type: 'move',
            x: localAvatar.position.x,
            y: localAvatar.position.y,
            z: localAvatar.position.z,
            rotY: localAvatar.rotation.y,
            legL: legLeft.rotation.x,
            legR: legRight.rotation.x
          });
        } else {
          // Emotes when stationary
          if (currentEmote === 'dance') {
            walkCycle += 0.3;
            armLeft.rotation.z = Math.sin(walkCycle) * 1.2;
            armRight.rotation.z = -Math.sin(walkCycle) * 1.2;
            localAvatar.rotation.y += 0.05;
          } else if (currentEmote === 'wave') {
            armRight.rotation.z = Math.PI - Math.sin(Date.now() * 0.01) * 0.4;
          } else if (currentEmote === 'bow') {
            localAvatar.rotation.x = 0.35;
          } else {
            localAvatar.rotation.x = 0;
            legLeft.rotation.x = 0;
            legRight.rotation.x = 0;
            armLeft.rotation.x = 0;
            armLeft.rotation.z = 0;
            armRight.rotation.x = 0;
            armRight.rotation.z = 0;
          }
        }

        // Third-Person Orbit Camera Follow
        const cx = localAvatar.position.x + Math.sin(camYaw) * Math.cos(camPitch) * camDistance;
        const cy = localAvatar.position.y + Math.sin(camPitch) * camDistance + 1.8;
        const cz = localAvatar.position.z + Math.cos(camYaw) * Math.cos(camPitch) * camDistance;

        camera.position.set(cx, cy, cz);
        camera.lookAt(localAvatar.position.x, localAvatar.position.y + 1.8, localAvatar.position.z);

        checkInteractions();
      } else if (isSitting) {
        camera.position.set(-1.0, 3.2, 2.0);
        camera.lookAt(-13.3, 4.6, 2.0);
      }

      renderer.render(scene, camera);
    }
